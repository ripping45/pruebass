services:
  qwen-translator:
    build: .
    container_name: qwen_translator_api
    ports:
      - "8000:8000"
    shm_size: '2gb'
    environment:
      MODEL_NAME: "Qwen/Qwen2.5-1.5B-Instruct"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

  phi-translator:
    build: .
    container_name: phi_translator_api
    ports:
      - "8001:8000"
    shm_size: '4gb'
    environment:
      MODEL_NAME: "microsoft/Phi-3.5-mini-instruct"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
